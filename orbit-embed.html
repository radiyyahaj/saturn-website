    <div class="hint">hover or tap a vertical to see what it does</div>
  </div>

<script>
(function () {
  var svg = document.getElementById("scene");
  var path = document.getElementById("orbitPath");
  var units = [].slice.call(svg.querySelectorAll("g.unit"));
  var tags = {};
  [].forEach.call(svg.querySelectorAll("g.unit-tag"), function (t) {
    tags[t.getAttribute("data-unit")] = t;
  });

  var PERIOD = 10000;      // ms per full revolution (8-12s per the brief)
  var DEPTH_SCALE = 0.13;  // how much cards grow on the near side
  var DEPTH_FADE = 0.22;   // how much cards dim on the far side

  var N = 1200;
  var L = path.getTotalLength();
  var pts = [];

  // pause bookkeeping so hovering freezes the orbit cleanly
  var paused = false, activeUnit = null;
  var accPause = 0, pauseStart = 0;

  // ?#t=5000 freezes the animation at that millisecond (still-frame helper)
  var frozenMatch = location.hash.match(/t=(\d+)/);
  var frozen = frozenMatch ? +frozenMatch[1] : null;

  var SVGNS = "http://www.w3.org/2000/svg";

  function setup() {
    var parent = units[0].parentNode;
    var toParent = parent.getScreenCTM().inverse().multiply(path.getScreenCTM());
    var yMin = Infinity, yMax = -Infinity;
    pts = [];
    for (var i = 0; i < N; i++) {
      var p = path.getPointAtLength((i / N) * L);
      var pt = svg.createSVGPoint();
      pt.x = p.x; pt.y = p.y;
      pt = pt.matrixTransform(toParent);
      pts.push(pt);
      if (pt.y < yMin) yMin = pt.y;
      if (pt.y > yMax) yMax = pt.y;
    }
    units.forEach(function (u) {
      var b = u.getBBox();
      var cx = b.x + b.width / 2, cy = b.y + b.height / 2;
      var best = 0, bd = Infinity;
      for (var i = 0; i < N; i++) {
        var dx = pts[i].x - cx, dy = pts[i].y - cy;
        var d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
      u._cx = cx; u._cy = cy;
      u._home = best;
      u._yMin = yMin; u._yMax = yMax;

      // invisible hit area so the whole card is hoverable, not just the ink
      var r = document.createElementNS(SVGNS, "rect");
      r.setAttribute("x", b.x); r.setAttribute("y", b.y);
      r.setAttribute("width", b.width); r.setAttribute("height", b.height);
      r.setAttribute("fill", "transparent");
      r.setAttribute("pointer-events", "all");
      r.style.cursor = "pointer";
      u.insertBefore(r, u.firstChild);

      u.addEventListener("mouseenter", function () { enter(u); });
      u.addEventListener("mouseleave", leave);
      // touch: tap a card to open it, tap it again (or the background) to close
      u.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (activeUnit === u.getAttribute("data-unit")) leave(); else enter(u);
      });
    });
  }

  svg.addEventListener("click", function () { if (activeUnit) leave(); });

  function enter(u) {
    activeUnit = u.getAttribute("data-unit");
    if (!paused) { paused = true; pauseStart = performance.now(); }
    Object.keys(tags).forEach(function (k) {
      tags[k].style.opacity = (k === activeUnit) ? 1 : 0;
    });
    document.body.classList.add("explored");
  }

  function leave() {
    if (paused) { accPause += performance.now() - pauseStart; paused = false; }
    activeUnit = null;
    Object.keys(tags).forEach(function (k) { tags[k].style.opacity = 0; });
  }

  function frame(now) {
    var base = (frozen !== null) ? frozen : (paused ? pauseStart : now);
    var travel = ((base - accPause) / PERIOD) * N;
    units.forEach(function (u) {
      var idx = (u._home + travel) % N;
      var i0 = Math.floor(idx), i1 = (i0 + 1) % N, f = idx - i0;
      var x = pts[i0].x + (pts[i1].x - pts[i0].x) * f;
      var y = pts[i0].y + (pts[i1].y - pts[i0].y) * f;
      var dx = x - pts[u._home].x;
      var dy = y - pts[u._home].y;
      var v = (y - u._yMin) / (u._yMax - u._yMin); // 0 far (top) .. 1 near (bottom)
      var k = 1 - DEPTH_SCALE / 2 + DEPTH_SCALE * v;
      u.setAttribute("transform",
        "translate(" + dx + "," + dy + ") " +
        "translate(" + u._cx + "," + u._cy + ") scale(" + k + ") " +
        "translate(" + (-u._cx) + "," + (-u._cy) + ")");
      u.setAttribute("opacity", (1 - DEPTH_FADE) + DEPTH_FADE * v);

      // caption rides along with its card so it sits beside it when revealed
      var tag = tags[u.getAttribute("data-unit")];
      if (tag) tag.setAttribute("transform", "translate(" + dx + "," + dy + ")");
    });
    requestAnimationFrame(frame);
  }

  setup();
  requestAnimationFrame(frame);
})();
</script>
